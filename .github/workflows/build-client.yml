name: Build ILrDOS Clients

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to upload artifacts to"
        required: false
        type: string
  push:
    branches: ["main", "master"]
    paths:
      - "client/**"
      - "src/**"
      - "scripts/build-linux.sh"
      - "scripts/build-windows.bat"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── Linux: ilrdosd + ilrdos-client ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libssl-dev pkg-config

      - name: Compilar
        run: |
          chmod +x scripts/build-linux.sh
          scripts/build-linux.sh

      - name: Ler versão
        id: ver
        run: echo "version=$(cat VERSION 2>/dev/null || echo 1.0.0)" >> "$GITHUB_OUTPUT"

      - name: Enviar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: ILrDOS-${{ steps.ver.outputs.version }}-linux-x64
          path: |
            build/ilrdosd
            build/ilrdos-client
          if-no-files-found: error

  # ── Windows: ILrDOS-Terminal.exe ───────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar
        shell: cmd
        run: scripts\build-windows.bat

      - name: Ler versão
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION 2>/dev/null || echo 1.0.0)" >> "$GITHUB_OUTPUT"

      - name: Enviar artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: ILrDOS-${{ steps.ver.outputs.version }}-windows-x64
          path: build\ILrDOS-Terminal.exe
          if-no-files-found: error

        # ── Release: anexa tudo ao tag v* ──────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Baixar artefatos Linux
        uses: actions/download-artifact@v4
        with:
          pattern: ILrDOS-*-linux-x64
          merge-multiple: true
          path: dist/linux

      - name: Baixar artefato Windows
        uses: actions/download-artifact@v4
        with:
          pattern: ILrDOS-*-windows-x64
          merge-multiple: true
          path: dist/windows

      - name: Conferir arquivos
        run: |
          ls -la dist/linux dist/windows
          test -f dist/linux/ilrdosd
          test -f dist/linux/ilrdos-client
          test -f dist/windows/ILrDOS-Terminal.exe

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "ILrDOS $TAG" --generate-notes
          gh release upload "$TAG" \
            dist/linux/ilrdosd \
            dist/linux/ilrdos-client \
            dist/windows/ILrDOS-Terminal.exe \
            --clobber
