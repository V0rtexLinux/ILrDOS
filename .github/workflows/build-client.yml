name: Build ILrDOS Windows Client

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "client/**"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows-client:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC (Developer Command Prompt)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar cliente
        shell: cmd
        run: |
          if not exist build mkdir build
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /DUNICODE /D_UNICODE ^
            client\ilrdos_client.cpp /Fe:build\ILrDOS-Terminal.exe ^
            /link Ws2_32.lib Bcrypt.lib

      - name: Ler versão
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION 2>/dev/null || echo 1.0.0)" >> "$GITHUB_OUTPUT"

      - name: Enviar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ILrDOS-Terminal-${{ steps.ver.outputs.version }}-windows-x64
          path: build\ILrDOS-Terminal.exe
          if-no-files-found: error

      - name: Publicar na Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG" 2>$null || gh release create "$env:TAG" --title "ILrDOS $env:TAG" --generate-notes
          gh release upload "$env:TAG" build\ILrDOS-Terminal.exe --clobber
